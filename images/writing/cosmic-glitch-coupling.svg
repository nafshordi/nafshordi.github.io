<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">A small mismatch in cosmological gravity</title><desc id="desc">Reported CMB plus DESI DR2 ratio G cosmological over G Newtonian equals 0.9920 plus or minus 0.0025. One standard deviation interval. Equal couplings have ratio one.</desc>
<rect width="1200" height="660" fill="#f4f1eb"/>
<g font-family="Arial, sans-serif" fill="#151b2c">
<text x="80" y="80" font-size="23" fill="#a44931" letter-spacing="2">COSMOLOGICAL GRAVITY · REPORTED FIT</text>
<text x="80" y="145" font-size="43" font-weight="700">How large is the proposed mismatch?</text>
<text x="80" y="194" font-size="26" fill="#5d6472">Planck + ACT + SPT primary CMB, combined with DESI DR2 BAO</text>
<line x1="160" y1="378" x2="1040" y2="378" stroke="#5d6472" stroke-width="2"/>
<g stroke="#5d6472" stroke-width="2"><path d="M160 371v14 M380 371v14 M600 371v14 M820 371v14 M1040 371v14"/></g>
<g font-size="24" text-anchor="middle"><text x="160" y="425">0.980</text><text x="380" y="425">0.985</text><text x="600" y="425">0.990</text><text x="820" y="425">0.995</text><text x="1040" y="425">1.000</text></g>
<line x1="1040" y1="246" x2="1040" y2="380" stroke="#5d6472" stroke-width="3" stroke-dasharray="8 7"/>
<text x="1040" y="235" text-anchor="end" font-size="24">Equal couplings</text>
<line x1="578" y1="300" x2="798" y2="300" stroke="#167c80" stroke-width="9" stroke-linecap="round"/>
<path d="M578 281v38 M798 281v38" stroke="#167c80" stroke-width="4"/>
<circle cx="688" cy="300" r="12" fill="#167c80"/>
<text x="688" y="267" text-anchor="middle" font-size="29" font-weight="700" fill="#167c80">0.9920 ± 0.0025</text>
<text x="600" y="479" text-anchor="middle" font-size="29">Cosmological coupling / Newtonian coupling</text>
<text x="80" y="553" font-size="25">About 0.8% weaker in this fit; the interval shown is ±1σ.</text>
<text x="80" y="600" font-size="21" fill="#5d6472">Original summary graphic · arXiv:2609.40176 · Model-conditioned inference</text>
</g></svg>
