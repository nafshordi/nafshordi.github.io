<g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="21" fill="#a44931" letter-spacing="1.5">PAPER FIGURE 1 · JOINT CONSTRAINT</text><text x="40" y="104" font-size="38" fill="#151b2c" font-weight="700">Adding DESI sharpens</text><text x="40" y="152" font-size="38" fill="#151b2c" font-weight="700">the gravity comparison</text><text x="40" y="197" font-size="23" fill="#5d6472" >Relative posterior density · Within the glitch model</text><rect x="100" y="276" width="530" height="303.999238952125" fill="white"/><svg x="100" y="276" width="530" height="303.999238952125" viewBox="14.377781 1.440002 225.339306 129.250901" overflow="hidden"><use xlink:href="#paper-fig1"/></svg><text x="453.3333333333333" y="258" font-size="25" fill="#151b2c" text-anchor="middle">Equal couplings</text><text x="100.0" y="614.999238952125" font-size="28" fill="#151b2c" text-anchor="middle">−2</text><text x="276.6666666666667" y="614.999238952125" font-size="28" fill="#151b2c" text-anchor="middle">−1</text><text x="453.33333333333337" y="614.999238952125" font-size="28" fill="#151b2c" text-anchor="middle">0</text><text x="630.0" y="614.999238952125" font-size="28" fill="#151b2c" text-anchor="middle">+1</text><text x="365.0" y="654.999238952125" font-size="28" fill="#151b2c" text-anchor="middle" font-weight="700">Glitch parameter Ω<tspan baseline-shift="sub" font-size="70%">g</tspan> (%)</text><path d="M40 706.999238952125h42" stroke="#d62728" stroke-width="4"/><text x="95" y="714.999238952125" font-size="26" fill="#d62728" >CMB only</text><path d="M40 749.999238952125h42" stroke="#0485d1" stroke-width="4"/><text x="95" y="757.999238952125" font-size="26" fill="#0485d1" >CMB + DESI BAO</text><path d="M40 792.999238952125h42" stroke="#01a049" stroke-width="4"/><text x="95" y="800.999238952125" font-size="26" fill="#01a049" >CMB + lensing + BAO + supernovae</text><text x="40" y="875" font-size="26" fill="#151b2c" >Negative Ω<tspan baseline-shift="sub" font-size="70%">g</tspan> = weaker cosmological gravity</text><text x="40" y="911" font-size="21" fill="#5d6472" >Ω<tspan baseline-shift="sub" font-size="70%">g</tspan> = 1 − G<tspan baseline-shift="sub" font-size="70%">N</tspan> / G<tspan baseline-shift="sub" font-size="70%">cosmo</tspan> · Model-conditioned inference</text></g></svg>