<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="700" height="940" viewBox="0 0 700 940" role="img" aria-labelledby="title desc">
<title id="title">Joint constraints on the cosmic glitch parameter</title><desc id="desc">Adapted from Wen et al. Figure 1, preserving its actual marginalized posterior curves. Red: primary CMB only. Blue: adding DESI BAO. Green: also adding CMB lensing and supernovae. The dashed zero line marks equal couplings. A negative glitch parameter corresponds to weaker cosmological gravity.</desc>
