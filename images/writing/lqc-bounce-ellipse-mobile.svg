<svg xmlns="http://www.w3.org/2000/svg" width="720" height="800" viewBox="0 0 720 800" role="img" aria-labelledby="t d"><title id="t">The homogeneous LQC constraint</title><desc id="d">Contraction follows the lower branch toward the critical-density bounce; expansion follows the upper branch toward lower density. The ellipse is not a prediction of repeated cycles.</desc><rect width="720" height="800" fill="#f4f1eb"/><g font-family="Arial, sans-serif" fill="#151b2c" font-size="32">
